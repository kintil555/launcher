name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EnderClient.sln

      - name: Build
        run: dotnet build EnderClient.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish src/EnderClient.Launcher/EnderClient.Launcher.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnderClient-win-x64
          path: publish/
