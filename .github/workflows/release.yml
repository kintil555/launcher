name: Release

# Every push to master ships a new version, end to end, in one job:
# bump patch version -> commit -> tag -> build -> sign -> publish GitHub
# Release with latest.json. No second workflow, no cross-workflow
# triggering, so no PAT is needed anywhere here — the default GITHUB_TOKEN
# is enough because everything happens inside this single job.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Skip the bump-commit's own push so this doesn't loop forever.
    if: ${{ github.event.head_commit.author.username != 'github-actions[bot]' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          CURRENT=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$NEW_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip release]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:master
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.bump.outputs.new_version }}
          releaseName: "Ender Client v${{ steps.bump.outputs.new_version }}"
          releaseBody: "See the assets below to download this version. The launcher will also offer to update itself automatically the next time it's opened."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
