name: Auto Release

# Runs on every push to master, bumps the patch version in tauri.conf.json,
# commits that bump back to master, then tags it — which in turn triggers
# release.yml (tag push -> build, sign, and publish a GitHub Release with
# an updated latest.json). This is what makes "git push" alone enough to
# ship an update through the in-app auto-updater, with no manual tagging.
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  debug-context:
    runs-on: ubuntu-latest
    steps:
      - name: Dump push event context
        run: |
          echo "head_commit.message: ${{ toJSON(github.event.head_commit.message) }}"
          echo "head_commit.author.username: ${{ toJSON(github.event.head_commit.author.username) }}"
          echo "head_commit.author.email: ${{ toJSON(github.event.head_commit.author.email) }}"
          echo "pusher.name: ${{ toJSON(github.event.pusher.name) }}"

  bump-and-tag:
    needs: debug-context
    runs-on: ubuntu-latest
    # Guard against an infinite loop: the version-bump commit below is
    # authored by github-actions[bot], so this job skips any push whose
    # most recent commit came from that bot account. Checking the commit
    # author instead of scanning the commit message for a marker string
    # avoids relying on github.event.head_commit.message, which isn't
    # reliably populated for every push (e.g. multi-commit pushes, or
    # pushes made via some non-standard git clients). Wrapped in ${{ }}
    # explicitly — bare `if:` expressions starting with special characters
    # or relying on implicit evaluation have known parser quirks across
    # GitHub's own tooling; ${{ }} is the unambiguous form.
    if: ${{ github.event.head_commit.author.username != 'github-actions[bot]' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$NEW_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip release]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:master
          git push origin "v${{ steps.bump.outputs.new_version }}"
