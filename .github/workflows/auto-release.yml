name: Auto Release

# Runs on every push to master, bumps the patch version in tauri.conf.json,
# commits that bump back to master, then tags it — which in turn triggers
# release.yml (tag push -> build, sign, and publish a GitHub Release with
# an updated latest.json). This is what makes "git push" alone enough to
# ship an update through the in-app auto-updater, with no manual tagging.
on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    # Guard against an infinite loop: the version-bump commit below is made
    # by github-actions[bot] and includes "[skip release]" in its message,
    # so this job ignores pushes that are themselves a bump commit.
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(node -p "require('./src-tauri/tauri.conf.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$NEW_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip release]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:master
          git push origin "v${{ steps.bump.outputs.new_version }}"
