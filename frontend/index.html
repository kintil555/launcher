<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ender Client</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">

    <header class="topbar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <img src="assets/logo.png" alt="" class="brand-logo">
        <div class="brand-text" data-tauri-drag-region>
          <span class="brand-title">Ender Client</span>
          <button id="launch-button-mini" class="btn-launch-mini">Launch</button>
        </div>
      </div>

      <div class="client-select-row" id="client-select-row">
        <button id="client-selector-button" class="client-selector-button">
          <span id="client-selector-label">Vanilla</span>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div id="client-selector-menu" class="client-selector-menu"></div>
      </div>

      <button id="settings-nav-button" class="icon-button" data-page="settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <button id="home-nav-button" class="nav-pill active" data-page="home">Home</button>

      <div class="window-controls">
        <button id="minimize-button" class="win-btn" title="Minimize">
          <svg viewBox="0 0 12 12" width="12" height="12"><rect x="1" y="5.5" width="10" height="1.4" fill="currentColor"/></svg>
        </button>
        <button id="close-button" class="win-btn win-btn-close" title="Close">
          <svg viewBox="0 0 12 12" width="12" height="12">
            <line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1.4"/>
            <line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="content">

      <section id="page-home" class="page active">
        <div class="model-stage">
          <canvas id="head-canvas"></canvas>
          <canvas id="body-canvas" style="display: none;"></canvas>
        </div>

        <div class="launch-row">
          <p id="status-text" class="status-text"></p>
          <button id="launch-button" class="btn-primary btn-launch-main">Launch</button>
        </div>
      </section>

      <section id="page-settings" class="page">
        <header class="page-header">
          <h1>Settings</h1>
          <p>Customize the look of Ender Client and manage your clients.</p>
        </header>

        <div class="settings-grid">

          <div class="settings-card">
            <h2>Appearance</h2>

            <label class="settings-label">Accent color</label>
            <div class="color-swatch-row" id="color-swatch-row"></div>

            <label class="settings-label">Font</label>
            <select id="font-selector">
              <option value="Mojangles">Mojangles</option>
              <option value="Segoe UI">Segoe UI</option>
              <option value="Inter">Inter</option>
              <option value="Consolas">Consolas</option>
              <option value="Georgia">Georgia</option>
            </select>

            <label class="settings-label">3D model</label>
            <div class="segmented" id="model-view-toggle">
              <button class="segmented-option active" data-value="head">Head</button>
              <button class="segmented-option" data-value="body">Full body</button>
            </div>
          </div>

          <div class="settings-card">
            <h2>Clients</h2>
            <p class="settings-hint">Pick up to 2 clients to inject together on launch.</p>

            <button id="add-client-button" class="btn-secondary add-client-btn">+ Add client</button>
            <div id="client-list" class="client-list"></div>
          </div>

          <div class="settings-card">
            <h2>Directory</h2>
            <label class="settings-label" for="directory-text">Launcher directory</label>
            <div class="directory-row">
              <input id="directory-text" type="text" readonly>
              <button id="open-folder-button" class="btn-secondary">Open</button>
            </div>
            <button id="change-folder-button" class="btn-secondary change-dir-btn">Change directory</button>
            <p id="directory-status" class="status-text"></p>
          </div>

        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/skinview3d/bundles/skinview3d.bundle.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
